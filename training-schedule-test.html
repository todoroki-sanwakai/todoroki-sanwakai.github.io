
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>市民消火隊 訓練予定表・表示試験</title>

<style>

  body {
    margin: 0;
    background: #f2f7fa;
    color: #243746;
    font-family: sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }

  main {
    max-width: 680px;
    margin: auto;
    padding: 16px 13px;
  }

  h1 {
    font-size: 23px;
    text-align: center;
    color: #1e5677;
  }

  .event {
    background: white;
    border: 2px solid #d0e1ea;
    border-radius: 14px;
    padding: 16px;
    margin: 16px 0;
  }

  .date {
    font-size: 21px;
    font-weight: bold;
    color: #1e5677;
  }

  .name {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
  }

  /* 時間・場所の文字を一回り大きくする */
  .event .details {
    font-size: 20px;
  }

  .back {
    display: block;
    background: #1e5677;
    color: white;
    text-align: center;
    padding: 13px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
  }

</style>
</head>

<body>
<main>
  <h1>市民消火隊 訓練予定表</h1>

  <p>今後の訓練予定をご案内します。</p>

  <!-- Googleカレンダーの予定を表示する場所 -->
  <div id="calendar-events" aria-live="polite">
    <p>Googleカレンダーとの接続準備中です。</p>
  </div>

  <a class="back" href="index.html">
    ホームページへ戻る
  </a>
</main>


<script>
/* 市民消火隊 Googleカレンダー自動表示 */

const API_KEY = "AIzaSyCvjvx6Qk7OH2O2J1EuF4thZDQs3qH-0xY";

const CALENDAR_ID =
  "0223aee15358709bcc2c9262bf3edf2f1c817088f6c6058ea64d36880e7bf7a7@group.calendar.google.com";

async function loadCalendarEvents() {
  const area = document.getElementById("calendar-events");

  area.textContent = "予定を読み込んでいます…";

  const start = new Date();
  const end = new Date();
  end.setDate(end.getDate() + 180);

  const params = new URLSearchParams({
    key: API_KEY,
    timeMin: start.toISOString(),
    timeMax: end.toISOString(),
    singleEvents: "true",
    orderBy: "startTime",
    maxResults: "100"
  });

  const url =
    "https://www.googleapis.com/calendar/v3/calendars/" +
    encodeURIComponent(CALENDAR_ID) +
    "/events?" + params.toString();

  try {
    const response = await fetch(url, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("API通信エラー：" + response.status);
    }

    const data = await response.json();
    area.replaceChildren();

    const events = data.items || [];

    if (events.length === 0) {
      area.textContent = "現在、登録された予定はありません。";
      return;
    }

    const dateFormat = {
      format(date) {
        const parts = new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo",
          month: "numeric",
          day: "numeric",
          weekday: "short"
        }).formatToParts(date);

        const get = (type) =>
          parts.find(p => p.type === type)?.value || "";

        return get("month") + "月" +
              get("day") + "日（" +
              get("weekday") + "）";
      }
    };

    const timeFormat = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

    for (const event of events) {
      const allDay = !event.start.dateTime;
      const startDate = new Date(
        event.start.dateTime || event.start.date + "T00:00:00+09:00"
      );

      const card = document.createElement("div");
      card.className = "event";

      function addLine(className, value) {
        const line = document.createElement("div");
        line.className = className;
        line.textContent = value;
        card.appendChild(line);
      }

      addLine("date", dateFormat.format(startDate));
      addLine("name", event.summary || "予定名なし");

      const time = allDay
        ? "終日"
        : timeFormat.format(new Date(event.start.dateTime)) +
          "～" +
          timeFormat.format(new Date(event.end.dateTime));

      addLine("details", "時間：" + time);
      addLine(
        "details",
        "場所：" + (event.location || "場所の記載なし")
      );

      area.appendChild(card);
    }

  } catch (error) {
    console.error(error);
    area.textContent =
      "予定を取得できませんでした。時間をおいて再度お試しください。";
  }
}

loadCalendarEvents();
</script>

</body>
</html>
